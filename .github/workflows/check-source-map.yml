name: Fortnightly digest

on:
  schedule:
    # 1st and 15th of each month at 07:00 UTC (8am UK during BST, 7am during
    # GMT). Cron can't express a true 14-day cycle, so fixed days of the month
    # are used instead -- gaps are 14-16 days depending on month length.
    - cron: "0 7 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check source map and send fortnightly digest email
        id: check
        env:
          GMAIL_ADDRESS: ${{ vars.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SITE_TAG: ${{ vars.CLOUDFLARE_SITE_TAG }}
        run: |
          set +e
          python3 scripts/send_fortnightly_digest.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat report.txt

      - name: Prepare source map sync as a pull request
        if: steps.check.outputs.exit_code == '1'
        run: |
          python3 scripts/check_source_map.py --diff-json diff.json || true
          python3 scripts/apply_source_map_changes.py diff.json --report pr-body.txt

      - name: Open pull request with the proposed sync
        if: steps.check.outputs.exit_code == '1'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Sync data/hospitals.ts with source map changes"
          branch: source-map-sync
          delete-branch: true
          title: "Source map sync - ${{ github.run_id }}"
          body-path: pr-body.txt
          add-paths: |
            data/hospitals.ts
            scripts/source-map-snapshot.json

      - name: Open issue if changes found
        if: steps.check.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.txt', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Source map changes detected - ${today}`,
              body: [
                'The fortnightly automated check found differences between the UK Eye Casualty Services source map and the last-reviewed snapshot.',
                '',
                'A pull request with the proposed changes to `data/hospitals.ts` has been opened for review -- nothing has been applied to the live site. Note that some entries have been intentionally hand-edited (see `scripts/pinned-overrides.json`) and the PR leaves those fields alone even if the source map changed them.',
                '',
                '---',
                '',
                '```',
                report.trim(),
                '```',
              ].join('\n'),
            });

      - name: Open issue if check failed
        if: steps.check.outputs.exit_code != '0' && steps.check.outputs.exit_code != '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.txt', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Source map check failed to run - ${today}`,
              body: [
                'The fortnightly automated check could not complete, so no comparison was made this run.',
                '',
                '```',
                report.trim(),
                '```',
              ].join('\n'),
            });
